name: Delokay sender
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [send, check, test, notify-test, enable, pause]
        default: send
permissions:
  contents: read
jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: telegram-members
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mirrorby/delokay-outreach
          ref: fca1002dbeddc5302e0af901b70266157e01ec92
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Send at most one message
        env:
          MODE: ${{ inputs.mode || 'send' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || '1fxhzfjbOjd6kJ6-uVQUP6-PVdKsTH9qQOgz4oww-ysc' }}
        run: python outreach.py "$MODE"
