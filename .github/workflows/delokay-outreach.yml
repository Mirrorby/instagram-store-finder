name: Delokay first message

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup — создать настройки; check — проверить; test — в Избранное; enable/pause — включить/выключить'
        type: choice
        options: [check, setup, test, send, enable, pause, notify-test]
        default: check

permissions:
  contents: read

jobs:
  outreach:
    uses: Mirrorby/delokay-outreach/.github/workflows/outreach.yml@43ff13743f09043eb94fc81cd1beb0975b82cc3a
    with:
      mode: ${{ inputs.mode }}
      source_ref: 43ff13743f09043eb94fc81cd1beb0975b82cc3a
    secrets:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
