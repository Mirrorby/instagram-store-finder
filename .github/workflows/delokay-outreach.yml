name: Delokay first message

on:
  schedule:
    - cron: '17,47 8-14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup — создать настройки; check — проверить; test — в Избранное; enable/pause — включить/выключить'
        type: choice
        options: [check, setup, test, send, enable, pause]
        default: check

permissions:
  contents: read

jobs:
  outreach:
    uses: Mirrorby/delokay-outreach/.github/workflows/outreach.yml@cca1a6040d3c99d2bb0317a0885c23d72c3bd670
    with:
      mode: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
      source_ref: cca1a6040d3c99d2bb0317a0885c23d72c3bd670
    secrets:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
