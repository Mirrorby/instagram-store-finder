name: Collect Telegram members

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Ссылки или @имена групп через пробел/запятую (до 20)'
        required: true
        type: string
        default: 'https://t.me/yardsalemd'
      check_only:
        description: 'Только проверить установку и тесты, без сбора'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-members
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-telegram.txt
      - name: Install Telegram and Sheets dependencies
        run: python -m pip install -r requirements-telegram.txt
      - name: Test collector
        run: python -m unittest tests.test_telegram_members -v
      - name: Collect accessible members and update Sheets
        if: ${{ !inputs.check_only }}
        env:
          TELEGRAM_GROUPS: ${{ inputs.groups }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -m store_finder.telegram_members --non-interactive
